<aside class="sidebar" [class.sidebar--collapsed]="collapsed()">
  <div class="sidebar__brand">
    <img class="sidebar__logo" src="assets/logo.png" alt="Sapumal Theatre — Art brings us together" />
  </div>

  <nav class="sidebar__nav">
    @for (item of nav; track item.route) {
      <a
        class="nav-link"
        [routerLink]="item.route"
        routerLinkActive="nav-link--active"
        (click)="navigate.emit()"
        [matTooltip]="item.label"
        matTooltipPosition="right"
      >
        <span class="nav-link__icon"><mat-icon>{{ item.icon }}</mat-icon></span>
        <span class="nav-link__label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar__tagline">
    <div class="sidebar__divider"></div>
    <p class="sidebar__tagline-text">ART<br />BRINGS US<br />TOGETHER</p>
    <div class="sidebar__diamond">
      <span></span><i></i><span></span>
    </div>
  </div>
  <div class="sidebar__curtain-spacer"></div>
</aside>
